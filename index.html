<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCAA Scores Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14181f;--mute:#667085;--line:#e3e6eb;--accent:#e8590c;--live:#d92d20;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--text:#eef1f5;--mute:#8d98a8;--line:#2a323d;--accent:#ff8a3d;--live:#ff5b4d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sports{margin:6px 0 2px;flex-wrap:wrap}
.sports button{white-space:nowrap;font-weight:600}
.sets{color:var(--mute);font-size:12.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.date{display:flex;gap:6px;align-items:center;margin-left:auto}
.date span{min-width:110px;text-align:center;font-weight:600}
.game{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;padding:3px 0}
.row img{width:26px;height:26px;object-fit:contain}
.rk{color:var(--mute);font-size:12px;min-width:20px;text-align:right}
.nm{flex:1;font-weight:500}
.nm.win{font-weight:700}
.rec{display:block;color:var(--mute);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.sc{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.star{border:0;background:none;font-size:18px;padding:0 4px;color:var(--mute)}
.star.f{color:#f5b301}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.live{color:var(--live);font-weight:700}
.empty,.err{text-align:center;color:var(--mute);padding:28px 8px}
.err{color:var(--live)}
.polls{margin:8px 0}
.polls button{font-size:13px;padding:4px 10px}
.rkcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin:8px 0}
.rkcard .row{padding:7px 0;border-bottom:1px solid var(--line)}
.rkcard .row:last-child{border-bottom:0}
.rkcard .rk{font-size:15px;font-weight:700;color:var(--text);min-width:26px}
.st{display:grid;grid-template-columns:26px 1fr 62px 66px 30px;gap:8px;align-items:center}
.st.h{color:var(--mute);font-size:12px;font-weight:600;padding:8px 0 4px;border-bottom:1px solid var(--line)}
.st.h span:nth-child(n+3),.st .num{text-align:center}
.st.r{padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.st.r:last-child{border-bottom:0}
.st .tm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.st .tm img{width:22px;height:22px;object-fit:contain}
.st .tm b{color:var(--mute);font-size:11.5px;font-weight:600}
.st .pos{color:var(--mute);font-size:13px;text-align:right}
.st .cf{font-weight:700}
select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);max-width:100%;margin:8px 0}
.pts{color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
details{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
input{font:inherit;width:100%;padding:8px 10px;margin:10px 0 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.pick{display:flex;align-items:center;gap:8px;padding:4px 0}
.pick img{width:22px;height:22px;object-fit:contain}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.foot{color:var(--mute);font-size:12px;text-align:center;margin:16px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏈🏀🏐⚾ NCAA Scores Tracker</h1>
  <div class="sub" id="status">Loading…</div>
  <div class="tabs sports" id="sports" role="tablist" aria-label="Sport"></div>
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <div class="date" id="dwrap">
      <button id="prev" aria-label="Previous day">‹</button>
      <span id="dlabel"></span>
      <button id="next" aria-label="Next day">›</button>
    </div>
  </div>
  <div id="list"></div>
  <details>
    <summary>My teams</summary>
    <div class="chips" id="chips"></div>
    <input id="q" placeholder="Search for a team to follow…" autocomplete="off">
    <div id="results"></div>
  </details>
  <div class="foot">Times shown in your local time zone · scores auto-refresh · records shown as overall (conference) · data via ESPN</div>
</div>
<script>
const BASE='https://site.api.espn.com/apis/site/v2/sports';
const SPORTS={
  fb:{label:'Football',emoji:'🏈',path:'football/college-football',q:'&groups=80',vb:false},
  mbb:{label:'Men\u2019s Basketball',emoji:'🏀',path:'basketball/mens-college-basketball',q:'&groups=50',vb:false},
  wbb:{label:'Women\u2019s Basketball',emoji:'🏀',path:'basketball/womens-college-basketball',q:'&groups=50',vb:false},
  wvb:{label:'Women\u2019s Volleyball',emoji:'🏐',path:'volleyball/womens-college-volleyball',q:'',vb:true},
  mvb:{label:'Men\u2019s Volleyball',emoji:'🏐',path:'volleyball/mens-college-volleyball',q:'',vb:true},
  bsb:{label:'Baseball',emoji:'⚾',path:'baseball/college-baseball',q:'',vb:false},
  sfb:{label:'Softball',emoji:'🥎',path:'softball/college-softball',q:'',vb:false}
};
function loadSport(){try{const v=localStorage.getItem('ncaaSport');return SPORTS[v]?v:'mbb'}catch(e){return 'mbb'}}
let sport=loadSport(), view='all', day=new Date(), games=[], teamsCache={}, reqId=0;
let ranksCache={}, teamRec={}, pollIdx=0, standCache={}, standConf={};
// favourites are stored per sport: {mbb:{id:{n,l}},wbb:{...},...}
function load(){
  try{
    const o=JSON.parse(localStorage.getItem('hoopsFavs')||'{}')||{};
    const keys=Object.keys(o);
    if(keys.length&&!keys.every(k=>SPORTS[k]))return {mbb:o};   // migrate old single-sport format
    return o;
  }catch(e){return {}}
}
const favsAll=load();
let favs=favsAll[sport]||(favsAll[sport]={});
function save(){try{localStorage.setItem('hoopsFavs',JSON.stringify(favsAll))}catch(e){}}
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const $=id=>document.getElementById(id);
const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;

// rank: scoreboard poll rank first, else fall back to the sport's top poll (covers volleyball, baseball, softball)
function rank(c){
  const r=c.curatedRank&&c.curatedRank.current;
  if(r&&r<=25)return r;
  const d=ranksCache[sport], p=d&&d.polls[0];
  const m=p&&p.ranks.find(x=>x.id===String(c.team.id));
  return m?m.rank:null;
}
function isFav(c){return !!favs[c.team.id]}
function relevant(g){return g.competitors.some(c=>isFav(c))}

// ---- records (overall + conference) ----
function pickRec(a){
  const f=re=>{const x=(a||[]).find(r=>re.test((r.type||'')+' '+(r.name||'')+' '+(r.description||''))&&/^\d+-\d+/.test(r.summary||''));return x&&x.summary};
  return {o:f(/total|overall/i),cf:f(/conf/i)};
}
function recFor(id,list,sp){
  sp=sp||sport;
  const a=pickRec(list), b=teamRec[sp+id]||{}, s=(standCache[sp]&&standCache[sp].map[String(id)])||{};
  return {o:a.o||s.o||b.o||'',cf:a.cf||s.cf||b.cf||''};
}
// shown everywhere as: overall (conference), e.g. 12-2 (6-1)
function recText(R){return [R.o,R.cf?'('+R.cf+')':''].filter(Boolean).join(' ')}
function rankById(id){
  const d=ranksCache[sport], p=d&&d.polls[0], m=p&&p.ranks.find(x=>x.id===String(id));
  return m?m.rank:null;
}
async function loadTeamRecs(ids,sp){
  await Promise.all(ids.map(async id=>{
    try{
      const j=await (await fetch(`${BASE}/${SPORTS[sp].path}/teams/${id}`)).json();
      teamRec[sp+id]=pickRec((j.team&&j.team.record&&j.team.record.items)||[]);
    }catch(e){teamRec[sp+id]={}}
  }));
}
async function fillRecs(ids){
  const sp=sport, need=[...new Set(ids)].filter(id=>!teamRec[sp+id]).slice(0,40);
  if(!need.length)return;
  await loadTeamRecs(need,sp);
  if(sp===sport)render();
}

// ---- rankings ----
async function loadRankings(sp){
  const c=ranksCache[sp];
  if(c&&Date.now()-c.t<600000)return c;
  try{
    const r=await fetch(`${BASE}/${SPORTS[sp].path}/rankings`);
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    const polls=(j.rankings||[]).map(p=>({
      name:p.name||p.shortName||'Poll',
      ranks:(p.ranks||[]).filter(x=>x.current&&x.current<=25&&x.team).map(x=>({
        rank:x.current,id:String(x.team.id),
        n:x.team.displayName||((x.team.location||'')+' '+(x.team.name||'')).trim(),
        l:x.team.logo||(x.team.logos&&x.team.logos[0]&&x.team.logos[0].href)||'',
        rec:x.recordSummary||'',pts:x.points
      }))
    })).filter(p=>p.ranks.length);
    ranksCache[sp]={t:Date.now(),polls};
  }catch(e){return c||(ranksCache[sp]={t:Date.now()-540000,polls:[]})}   // retry in ~1 min on failure
  return ranksCache[sp];
}

// ---- standings (by conference) ----
function stat(e,re,wl){
  const s=(e.stats||[]).find(x=>re.test([x.name,x.type,x.displayName,x.shortDisplayName,x.abbreviation].join(' '))&&(!wl||/^\d+-\d+/.test(x.displayValue||x.summary||'')));
  return s?(s.displayValue||s.summary||''):'';
}
function collect(node,parent,root){
  const out=[], name=root?'':(node.name||node.abbreviation||'');
  const label=parent&&name?parent+' \u00b7 '+name:(name||parent||'');
  const es=node.standings&&node.standings.entries;
  if(es&&es.length)out.push({name:label||'All teams',rows:es.filter(e=>e.team).map(e=>({
    id:String(e.team.id),n:e.team.displayName||e.team.name,
    l:(e.team.logos&&e.team.logos[0]&&e.team.logos[0].href)||e.team.logo||'',
    o:stat(e,/overall|total/i,true),cf:stat(e,/conf/i,true)}))});
  (node.children||[]).forEach(ch=>out.push(...collect(ch,label,false)));
  return out;
}
async function loadStandings(sp){
  const c=standCache[sp];
  if(c&&Date.now()-c.t<600000)return c;
  const S='https://site.api.espn.com/apis/v2/sports/'+SPORTS[sp].path+'/standings';
  const g=(SPORTS[sp].q.match(/groups=(\d+)/)||[])[1];
  const urls=[S,g?S+'?group='+g:null,S+'?level=3'].filter(Boolean);
  let groups=[];
  for(const u of urls){
    try{
      const r=await fetch(u);if(!r.ok)continue;
      groups=collect(await r.json(),'',true);
      if(groups.length)break;
    }catch(e){}
  }
  groups.sort((a,b)=>a.name.localeCompare(b.name));
  const map={};
  groups.forEach(gr=>gr.rows.forEach(r=>{map[r.id]={o:r.o,cf:r.cf}}));
  return standCache[sp]={t:groups.length?Date.now():Date.now()-540000,groups,map};   // retry in ~1 min on failure
}
const wlPct=s=>{const m=/^(\d+)-(\d+)/.exec(s||'');return m&&(+m[1]+ +m[2])?+m[1]/(+m[1]+ +m[2]):-1};
function renderStandings(){
  const d=standCache[sport];
  if(!d){$('list').innerHTML='<div class="empty">Loading standings…</div>';return}
  if(!d.groups.length){$('list').innerHTML='<div class="empty">Standings aren\u2019t available for this sport right now.</div>';return}
  let gi=d.groups.findIndex(g=>g.name===standConf[sport]);
  if(gi<0){gi=d.groups.findIndex(g=>g.rows.some(r=>favs[r.id]));if(gi<0)gi=0}
  const gr=d.groups[gi];
  const rows=gr.rows.slice().sort((a,b)=>wlPct(b.cf)-wlPct(a.cf)||wlPct(b.o)-wlPct(a.o));
  $('list').innerHTML=`<select id="confsel" aria-label="Conference">${d.groups.map((g,i)=>`<option value="${i}" ${i===gi?'selected':''}>${g.name}</option>`).join('')}</select>
  <div class="rkcard"><div class="st h"><span></span><span>Team</span><span>Conf</span><span>Overall</span><span></span></div>`+
  rows.map((r,i)=>{const rk=rankById(r.id);return `<div class="st r">
    <span class="pos">${i+1}</span>
    <span class="tm"><img src="${r.l}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">${rk?`<b>${rk}</b>`:''}<span>${r.n}</span></span>
    <span class="num cf">${r.cf||'–'}</span><span class="num">${r.o||'–'}</span>
    <button class="star ${favs[r.id]?'f':''}" data-t="${r.id}" data-n="${r.n.replace(/"/g,'')}" data-l="${r.l}" aria-label="Follow team">${favs[r.id]?'★':'☆'}</button>
  </div>`}).join('')+`</div>`;
}

async function fetchGames(){
  const my=++reqId, sp=sport;
  try{
    const r=await fetch(`${BASE}/${SPORTS[sp].path}/scoreboard?dates=${ymd(day)}${SPORTS[sp].q}&limit=400`);
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    if(my!==reqId)return false;   // user switched sport/day while loading
    games=(j.events||[]).map(e=>{
      const c=e.competitions[0], t=e.status.type;
      const bc=(c.broadcasts||[]).flatMap(b=>b.names||[]).join(', ');
      return {id:e.id,date:new Date(e.date),state:t.state,detail:t.shortDetail,
        completed:t.completed,broadcast:bc,
        competitors:[...c.competitors].sort((a,b)=>a.homeAway==='away'?-1:1)};
    });
    $('status').textContent=SPORTS[sp].label+' · Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'})+' ('+tz+')';
  }catch(e){
    if(my!==reqId)return false;
    games=[];$('list').innerHTML='<div class="err">Couldn’t load scores. Check your connection — retrying automatically.</div>';
    $('status').textContent='Offline';return false;
  }
  return true;
}

function row(c,g){
  const r=rank(c),sc=g.state==='pre'?'':c.score;
  const win=g.state==='post'&&c.winner;
  const rs=recText(recFor(c.team.id,c.records));
  return `<div class="row">
    <span class="rk">${r??''}</span>
    <img src="${c.team.logo||''}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <span class="nm ${win?'win':''}">${c.team.displayName}${rs?`<span class="rec">${rs}</span>`:''}</span>
    <span class="sc">${sc}</span>
    <button class="star ${isFav(c)?'f':''}" data-t="${c.team.id}" data-n="${c.team.displayName.replace(/"/g,'')}" data-l="${c.team.logo||''}" aria-label="Follow team">${isFav(c)?'★':'☆'}</button>
  </div>`;
}

function renderRankings(){
  const d=ranksCache[sport];
  if(!d){$('list').innerHTML='<div class="empty">Loading rankings…</div>';return}
  if(!d.polls.length){$('list').innerHTML='<div class="empty">No rankings are available for this sport right now.</div>';return}
  pollIdx=Math.min(pollIdx,d.polls.length-1);
  const p=d.polls[pollIdx];
  const tabs=d.polls.length>1?`<div class="tabs polls">${d.polls.map((x,i)=>`<button data-p="${i}" class="${i===pollIdx?'on':''}">${x.name}</button>`).join('')}</div>`:`<div class="sub polls"><b>${p.name}</b></div>`;
  $('list').innerHTML=tabs+`<div class="rkcard">`+p.ranks.map(t=>{
    const R=recFor(t.id,[],sport), rs=recText({o:R.o||t.rec,cf:R.cf});
    return `<div class="row">
      <span class="rk">${t.rank}</span>
      <img src="${t.l}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span class="nm">${t.n}${rs?`<span class="rec">${rs}</span>`:''}</span>
      ${t.pts!=null?`<span class="pts">${t.pts} pts</span>`:''}
      <button class="star ${favs[t.id]?'f':''}" data-t="${t.id}" data-n="${t.n.replace(/"/g,'')}" data-l="${t.l}" aria-label="Follow team">${favs[t.id]?'★':'☆'}</button>
    </div>`}).join('')+`</div>`;
  fillRecs(p.ranks.map(t=>t.id));
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.querySelectorAll('#sports button').forEach(b=>{const on=b.dataset.s===sport;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  const today=ymd(new Date())===ymd(day);
  $('dlabel').textContent=today?'Today':day.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
  $('dwrap').style.display=(view==='rank'||view==='stand')?'none':'';
  if(view==='rank'){renderRankings();return}
  if(view==='stand'){renderStandings();return}
  let list=games.slice();
  if(view==='fav')list=list.filter(relevant);
  if(view==='top')list=list.filter(g=>g.competitors.some(c=>rank(c)));
  if(view==='live')list=list.filter(g=>g.state==='in');
  const order={in:0,pre:1,post:2};
  list.sort((a,b)=>order[a.state]-order[b.state]||a.date-b.date);
  if(!list.length){
    const msg={fav:Object.keys(favs).length?'None of your teams play this day.':'Tap ☆ next to a team (or search under “My teams”) to follow it.',
      top:'No ranked teams in action this day.',live:'No games in progress right now.',all:'No games scheduled.'}[view];
    $('list').innerHTML=`<div class="empty">${msg}</div>`;return;
  }
  $('list').innerHTML=list.map(g=>{
    const t=g.state==='pre'?g.date.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',timeZoneName:'short'})
      :g.state==='in'?`<span class="live">● LIVE · ${g.detail}</span>`:g.detail;
    let sets='';
    if(SPORTS[sport].vb&&g.state!=='pre'&&g.competitors.length===2){
      const [a,h]=g.competitors,al=a.linescores||[],hl=h.linescores||[];
      const parts=al.map((l,i)=>hl[i]?Math.round(l.value)+'–'+Math.round(hl[i].value):'').filter(Boolean);
      if(parts.length)sets=`<div class="sets">Sets: ${parts.join(', ')}</div>`;
    }
    return `<div class="game">${g.competitors.map(c=>row(c,g)).join('')}${sets}
      <div class="meta"><span>${t}</span><span>${g.broadcast}</span></div></div>`;
  }).join('');
  // if the scoreboard lacks a conference record, fetch it for ranked / followed teams shown
  const miss=[];
  list.forEach(g=>g.competitors.forEach(c=>{
    if((rank(c)||isFav(c))&&!recFor(c.team.id,c.records).cf)miss.push(String(c.team.id));
  }));
  if(miss.length)fillRecs(miss);
}

function renderChips(){
  const ids=Object.keys(favs);
  $('chips').innerHTML=ids.length?ids.map(id=>`<button data-rm="${id}">${favs[id].n} ✕</button>`).join(''):'<span class="sub">No teams yet.</span>';
}

function toggle(id,n,l){
  if(favs[id])delete favs[id];else favs[id]={n,l};
  save();renderChips();render();searchTeams();
}

async function loadTeams(sp){
  if(teamsCache[sp])return teamsCache[sp];
  try{
    const j=await (await fetch(`${BASE}/${SPORTS[sp].path}/teams?limit=400`)).json();
    teamsCache[sp]=j.sports[0].leagues[0].teams.map(x=>({id:x.team.id,n:x.team.displayName,l:(x.team.logos||[{}])[0].href||''}));
  }catch(e){return []}
  return teamsCache[sp];
}
async function searchTeams(){
  const q=$('q').value.trim().toLowerCase(), sp=sport;
  if(!q){$('results').innerHTML='';return}
  const teams=await loadTeams(sp);
  if(sp!==sport||q!==$('q').value.trim().toLowerCase())return;   // stale
  $('results').innerHTML=teams.filter(t=>t.n.toLowerCase().includes(q)).slice(0,8).map(t=>
    `<div class="pick"><img src="${t.l}" alt=""><span style="flex:1">${t.n}${(()=>{const x=recText(recFor(t.id,[],sp));return x?`<span class="rec">${x}</span>`:''})()}</span>
    <button class="star ${favs[t.id]?'f':''}" data-t="${t.id}" data-n="${t.n.replace(/"/g,'')}" data-l="${t.l}">${favs[t.id]?'★':'☆'}</button></div>`).join('')||'<div class="sub">No match.</div>';
}

$('sports').innerHTML=Object.keys(SPORTS).map(k=>`<button role="tab" data-s="${k}">${SPORTS[k].emoji} ${SPORTS[k].label}</button>`).join('');
$('tabs').innerHTML=[['all','All games'],['fav','My teams'],['rank','Rankings'],['stand','Standings'],['top','Ranked games'],['live','Live']].map(([v,l])=>`<button data-v="${v}">${l}</button>`).join('');
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s){
    if(b.dataset.s===sport)return;
    sport=b.dataset.s;favs=favsAll[sport]||(favsAll[sport]={});pollIdx=0;
    try{localStorage.setItem('ncaaSport',sport)}catch(e){}
    games=[];$('q').value='';$('results').innerHTML='';
    $('list').innerHTML='<div class="empty">Loading…</div>';
    renderChips();render();refresh();
  }
  else if(b.dataset.v){view=b.dataset.v;render()}
  else if(b.dataset.p!==undefined){pollIdx=+b.dataset.p;render()}
  else if(b.dataset.t)toggle(b.dataset.t,b.dataset.n,b.dataset.l);
  else if(b.dataset.rm){delete favs[b.dataset.rm];save();renderChips();render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='confsel'){const d=standCache[sport];if(d&&d.groups[+e.target.value]){standConf[sport]=d.groups[+e.target.value].name;render()}}
});
$('prev').onclick=async()=>{day=new Date(day.getTime()-864e5);await refresh()};
$('next').onclick=async()=>{day=new Date(day.getTime()+864e5);await refresh()};
$('q').addEventListener('input',searchTeams);

async function refresh(){
  const sp=sport;
  const [ok]=await Promise.all([fetchGames(),loadRankings(sp),loadStandings(sp)]);
  if(sp!==sport)return;
  if(ok||view==='rank'||view==='stand')render();
}
renderChips();refresh();
// live refresh: every 20s when viewing today and a game is in progress, else every 2 min
setInterval(()=>{
  if(document.hidden)return;
  const today=ymd(new Date())===ymd(day);
  if(today&&games.some(g=>g.state==='in'))refresh();
},20000);
setInterval(()=>{if(!document.hidden)refresh()},120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script>
</body>
</html>
